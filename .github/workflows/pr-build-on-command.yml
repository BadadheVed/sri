name: PR Build On Command

# Fires when anyone comments on a PR; the `if:` below is what actually
# restricts it to "/build" comments from the PR's own author — everyone
# else's comments just fall through and no job runs.
on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  build:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/build') &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    steps:
      - name: React to the trigger comment
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: "eyes",
            });

      # issue_comment events aren't tied to a specific commit, but GitHub
      # always keeps refs/pull/<N>/head pointing at the PR's latest commit —
      # this checks that out directly, no extra API call needed to look it up.
      - name: Checkout PR head commit
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head

      - name: Record commit SHA
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Mark build as pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: "${{ steps.head.outputs.sha }}",
              state: "pending",
              context: "pr-build-on-command",
              description: "Build check running...",
            });

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod

      - name: go build
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      - name: Report success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ steps.head.outputs.sha }}";
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: "success", context: "pr-build-on-command",
              description: "go build, vet, and test all passed",
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Build check passed on \`${sha.substring(0, 7)}\` — \`go build\`, \`go vet\`, and \`go test ./...\` all succeeded.`,
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const sha = "${{ steps.head.outputs.sha }}";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner, repo: context.repo.repo, sha,
              state: "failure", context: "pr-build-on-command",
              description: "Build check failed",
            });
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Build check failed on \`${sha.substring(0, 7)}\` — see the [workflow run](${runUrl}) for details.`,
            });
