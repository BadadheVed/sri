apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sage.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sage.backend.selectorLabels" . | nindent 4 }}
---
# Read-only, cluster-wide: backend/ watches Events and reads Pods across the
# whole cluster to detect and correlate incidents, and reads Deployments to
# verify a rollout succeeded after a remediation (scale_deployment,
# patch_resources, rollback_deployment). It also watches Services and
# Namespaces cluster-wide to build the live topology graph streamed on
# /ws/topology (informer caches: get/list/watch), plus Pods (watch) to
# resolve Beyla's workload names to Services. It never mutates anything —
# that capability lives only in the mcp-execute-server ClusterRole below,
# deliberately as a separate, more narrowly scoped identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sage.rbac.backend.name" . }}
  labels:
    {{- include "sage.backend.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    # watch: the topology Pod informer maps Services to the workload names
    # Beyla reports and pod IPs (edge server addresses) to Services.
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sage.rbac.backend.name" . }}
  labels:
    {{- include "sage.backend.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sage.rbac.backend.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sage.backend.fullname" . }}
    namespace: {{ .Release.Namespace }}
