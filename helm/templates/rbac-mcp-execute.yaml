apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "sage.mcpExecute.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sage.mcpExecute.selectorLabels" . | nindent 4 }}
---
# The ONLY identity in this chart with write access to the cluster. This is the
# infrastructure-level enforcement of the application-level bearer-token MCP
# boundary. mcp-execute-server can read pods, replicasets, and deployments
# cluster-wide, and can patch/update deployments. Note: 'update' on deployments
# (not just 'patch') is required by rollback_deployment, which replaces the
# entire spec.template rather than using merge-patch semantics. Even if the
# application-level gate had a bug, this ClusterRole is the hard stop.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "sage.rbac.mcpExecute.name" . }}
  labels:
    {{- include "sage.mcpExecute.selectorLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "sage.rbac.mcpExecute.name" . }}
  labels:
    {{- include "sage.mcpExecute.selectorLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "sage.rbac.mcpExecute.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sage.mcpExecute.fullname" . }}
    namespace: {{ .Release.Namespace }}
