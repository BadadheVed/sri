nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []

backend:
  # MUST stay 1 — reconcile.Reconciler has no leader election; running more
  # than one replica risks duplicate remediation actions on the same
  # incident. Enforced at template-render time, not just documented here.
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 8080
  service:
    type: ClusterIP
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /slack
    pathType: Prefix
    annotations: {}
    tls: []
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mcpExecute:
  # Stateless and idempotent (restart_pod is safe to retry) — safely
  # scalable if ever needed, unlike backend.
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 8090
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # No service.type knob here at all, by design — see templates/service-mcp-execute.yaml.
  # This is the only component with cluster-mutation credentials; it must
  # never be reachable from outside the cluster, and there is deliberately
  # no values.yaml key that could accidentally change that.

nats:
  enabled: true
  fullnameOverride: "sage-nats"
  # JetStream persistence for the pending-incidents stream — verified against
  # `helm show values nats/nats --version 2.14.4` (Task 20); these keys match
  # that chart's real values schema.
  config:
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 1Gi

mcpReadonly:
  # Stateless and read-only — safely scalable if ever needed, same
  # reasoning as mcpExecute.replicaCount's comment, opposite conclusion
  # from backend's (which must stay 1).
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  port: 8091
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ai:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

mcpReadonlyToken: ""
diagnosisCallbackToken: ""

llm:
  provider: ""   # "anthropic" | "openai" | "openrouter" | "google"
  model: ""
  apiKey: ""

langfuse:
  # Off by default — self-hosted Langfuse is a real out-of-band
  # infrastructure prerequisite (its own Postgres+ClickHouse+Redis+web
  # stack), not something this chart installs. See helm/README.md before
  # setting enabled: true.
  enabled: false
  host: ""   # e.g. http://langfuse-web.langfuse.svc.cluster.local:3000
  promptCacheTtlSeconds: 60

langfusePublicKey: ""
langfuseSecretKey: ""   # required when langfuse.enabled is true

pxMetrics:
  # Off by default — Pixie is a real out-of-band infrastructure prerequisite
  # (self-hosted Pixie Cloud + Vizier), not something this chart installs.
  # See helm/README.md before setting enabled: true.
  enabled: false
  connMode: cloud   # "cloud" | "direct" — "cloud" covers both hosted Community Cloud and self-hosted Pixie Cloud, same wire protocol
  vizierAddr: ""     # required when enabled — the cloud/Vizier address (host:port)
  clusterId: ""       # required when enabled && connMode == cloud
  insecureSkipTLSVerify: false  # for self-hosted Pixie Cloud using a self-signed/local CA (e.g. mkcert) this process doesn't trust by default — see helm/README.md

pixieApiKey: ""        # required when pxMetrics.enabled && pxMetrics.connMode == cloud

remediation:
  # "auto" or "manual" — validated by settings.Load() in the app itself, and
  # checked again here so `helm install`/`helm template` fails fast with a
  # clear message instead of deploying pods that will crash-loop.
  mode: manual

timeouts:
  verifySeconds: 60
  correlationWindowSeconds: 60

slack:
  approvalChannel: "#sre-approvals"
  botToken: ""
  signingSecret: ""

mcpExecuteToken: ""

secrets:
  # Name of a pre-existing Secret with keys DATABASE_URL, SLACK_BOT_TOKEN,
  # SLACK_SIGNING_SECRET, MCP_EXECUTE_TOKEN, MCP_READONLY_TOKEN,
  # DIAGNOSIS_CALLBACK_TOKEN, LLM_API_KEY, and (if pxMetrics.enabled with
  # connMode=cloud) PIXIE_API_KEY. When set, the chart's own secret.yaml is
  # skipped entirely and slack.*/mcpExecuteToken/database values above are
  # ignored — you own the Secret's lifecycle.
  existingSecret: ""

postgresql:
  enabled: true
  fullnameOverride: "sage-postgresql"
  image:
    tag: "16"
  auth:
    username: sage
    password: "changeme"
    database: sage

externalDatabase:
  # Only consulted when postgresql.enabled=false and secrets.existingSecret
  # is unset.
  url: ""

migration:
  image:
    repository: postgres
    tag: 16-alpine
  backoffLimit: 2
